name: release-cli

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          say() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          if [ "${{ github.ref_type }}" = "tag" ]; then
            say true "tag ${GITHUB_REF_NAME}: building the release matrix"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            say true "${{ github.event_name }}: building on request"; exit 0
          fi

          if [ -n "$(git tag --points-at HEAD)" ]; then
            say false "$(git tag --points-at HEAD | tr '\n' ' ')points at this commit — leaving the build to the tag run"; exit 0
          fi

          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            say true "no usable previous commit — building"; exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '(\.go$|^go\.(mod|sum)$|^Makefile$|^scripts/|^box/Dockerfile|^\.github/workflows/release-cli\.yml$)'; then
            say true "source changed — building"
          else
            say false "nothing that reaches a binary changed — skipping the matrix"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require CLUB_DEFAULT_CONTROL
        id: control
        run: |
          url="${{ vars.CLUB_DEFAULT_CONTROL }}"
          if [ -z "$url" ]; then
            echo "Set repository variable CLUB_DEFAULT_CONTROL to the deployment control-plane URL." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Fetch bundled git (all arches)
        run: make fetch-git-all
      - name: Cross-compile release matrix
        run: make release CONTROL_URL=${{ steps.control.outputs.url }}
      - name: Check the matrix is complete and stamped
        run: |
          set -eu
          for p in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            test -s "dist/club-$p" || { echo "missing dist/club-$p" >&2; exit 1; }
          done
          got="$(./dist/club-linux-amd64 --version)"
          echo "linux-amd64 reports: $got"
          echo "$got" | grep -q "(wire " || {
            echo "binary does not report its wire version: $got" >&2; exit 1; }
          if echo "$got" | grep -q "wire 0.0.0-dev"; then
            echo "the wire version is unstamped — every request would be below any floor" >&2; exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            v*)
              echo "$got" | grep -q "version ${GITHUB_REF_NAME}" || {
                echo "binary reports $got, not the tag ${GITHUB_REF_NAME}" >&2; exit 1; }
              echo "$got" | grep -q "(wire ${GITHUB_REF_NAME})" || {
                echo "binary presents a wire version that is not the tag: $got" >&2; exit 1; } ;;
          esac
          ./dist/club-linux-amd64 --help >/dev/null
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clubhouse-cli
          path: dist/club-*

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clubhouse-cli
          path: dist
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/club-*
          generate_release_notes: true
