name: pr

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch bundled git (all arches)
        run: make fetch-git-all

      - name: Build, vet and run the public guards
        run: make test

      - name: Cross-compile the full release matrix
        run: make release

      - name: Check the matrix is complete
        run: |
          set -eu
          for p in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            test -s "dist/club-$p" || { echo "missing dist/club-$p" >&2; exit 1; }
          done
          ./dist/club-linux-amd64 --version
          ./dist/club-linux-amd64 --help >/dev/null
